syntax = "proto3";

package users;

service UsersService {
  // Registration & User Creation
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);

  // User Retrieval & Validation
  rpc FindUserById (FindUserByIdRequest) returns (UserResponse);
  rpc ValidateUser (ValidateUserRequest) returns (UserResponse);

  // Profile Management
  rpc UpdateProfile (UpdateProfileRequest) returns (UpdateProfileResponse);

  // Password Management
  rpc ChangePassword (ChangePasswordRequest) returns (ActionResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (ActionResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ActionResponse);
}

// -----------------------------------------------------------------------------
// Request & Response Messages
// -----------------------------------------------------------------------------

message FindUserByIdRequest {
  string id = 1;
}

message ValidateUserRequest {
  string email = 1;
  string password = 2;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string username = 3;
  string role = 4;
  string status = 5;
  optional string profile_photo = 6;
  optional string birth_date = 7;
  string created_at = 8;
  string updated_at = 9;
}

message UpdateProfileRequest {
  string user_id = 1;
  optional string temp_key = 2;
  optional string old_photo = 3;
  optional string new_photo_key = 4;
  optional string username = 5;
  optional string birth_date = 6;
  optional string profile_photo = 7;
}

message UpdateProfileResponse {
  bool success = 1;
  string message = 2;
  string user_id = 3;
}

message ChangePasswordRequest {
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
  string user_agent = 4;
  string ip_address = 5;
  string jti = 6;
}

message ForgotPasswordRequest {
  string email = 1;
  string ip_address = 2;
}

message ResetPasswordRequest {
  string email = 1;
  string code = 2;
  string new_password = 3;
}

message ActionResponse {
  bool success = 1;
  string message = 2;
}

message ImageTransformations {
  optional int32 crop_x = 1;
  optional int32 crop_y = 2;
  optional int32 crop_width = 3;
  optional int32 crop_height = 4;
  optional int32 rotate = 5;
  optional float scale = 6;
}

message CreateUserRequest {
  optional string id = 1;
  string username = 2;
  string email = 3;
  string password = 4;
  optional string birth_date = 5;
  optional string profile_photo = 6;
  optional string temp_photo_key = 7;
  optional ImageTransformations transformations = 8;
}

message CreateUserResponse {
  bool success = 1;
  string message = 2;
  string user_id = 3;
}
