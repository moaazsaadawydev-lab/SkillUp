# ==============================================================================
# Upstream Definitions
# ==============================================================================

upstream api_gateway_upstream {
    server api-gateway:3000;
    keepalive 32;
}

upstream minio_s3_upstream {
    server minio:9000;
    keepalive 32;
}

upstream minio_console_upstream {
    server minio:9001;
    keepalive 32;
}

upstream rabbitmq_mgmt_upstream {
    server rabbitmq:15672;
}

# ==============================================================================
# HTTP Server Block (Port 80)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Standard Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Nginx Health Check
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # MinIO S3 API Reverse Proxy (Path-based)
    location /s3/ {
        proxy_pass http://minio_s3_upstream/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 100M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # MinIO S3 Direct Bucket Reverse Proxy (for client-direct presigned URLs via Nginx)
    location /skillhub-media/ {
        proxy_pass http://minio_s3_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 100M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # MinIO Web Console Reverse Proxy
    location /minio-console/ {
        proxy_pass http://minio_console_upstream/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # RabbitMQ Management Web UI Reverse Proxy
    location /rabbitmq/ {
        proxy_pass http://rabbitmq_mgmt_upstream/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Primary API Gateway Proxy (Default Fallback)
    location / {
        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Performance & Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
