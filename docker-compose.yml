services:
  # ==============================================================================
  # Backing Infrastructure Services
  # ==============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: skillhub_postgres
    restart: unless-stopped
    expose:
      - "5432"
    # ports:
    #   - "127.0.0.1:5433:5432" # Optional loopback for local DB management (DBeaver/TablePlus)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skillhub_db}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-skillhub_users,skillhub_catalog,skillhub_booking,skillhub_payment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skillhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skillhub_network

  redis:
    image: redis:7-alpine
    container_name: skillhub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    expose:
      - "6379"
    # ports:
    #   - "127.0.0.1:6379:6379" # Optional loopback for local Redis tools
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skillhub_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: skillhub_rabbitmq
    restart: unless-stopped
    expose:
      - "5672"
      - "15672"
    ports:
      - "127.0.0.1:15672:15672" # Localhost-only binding for RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - skillhub_network

  minio:
    image: minio/minio:latest
    container_name: skillhub_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    # ports:
    #   - "127.0.0.1:9001:9001" # Optional loopback for local MinIO console inspection
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skillhub_network

  # ==============================================================================
  # Application Microservices
  # ==============================================================================

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 3000
      USERS_SERVICE_GRPC_PORT: 50051
      USERS_SERVICE_GRPC_URL: users-service:50051
      CATALOG_SERVICE_GRPC_PORT: 50052
      CATALOG_SERVICE_GRPC_URL: catalog-service:50052
      BOOKING_SERVICE_GRPC_PORT: 50053
      BOOKING_SERVICE_GRPC_URL: booking-service:50053
      PAYMENT_SERVICE_GRPC_PORT: 50054
      PAYMENT_SERVICE_GRPC_URL: payment-service:50054
      NOTIFICATIONS_SERVICE_GRPC_PORT: 50055
      NOTIFICATIONS_SERVICE_GRPC_URL: notifications-service:50055
      MEDIA_SERVICE_GRPC_PORT: 50056
      MEDIA_SERVICE_GRPC_URL: media-service:50056
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKET: skillhub-media
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - skillhub_network

  users-service:
    build:
      context: .
      dockerfile: apps/users-service/Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
      - "50051"
    environment:
      NODE_ENV: production
      USERS_SERVICE_HTTP_PORT: 3001
      USERS_SERVICE_GRPC_PORT: 50051
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: skillhub_users
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      RABBITMQ_USERS_QUEUE: users_queue
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skillhub_network

  catalog-service:
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    restart: unless-stopped
    expose:
      - "3002"
      - "50052"
    environment:
      NODE_ENV: production
      CATALOG_SERVICE_HTTP_PORT: 3002
      CATALOG_SERVICE_GRPC_PORT: 50052
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: skillhub_catalog
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      RABBITMQ_CATALOG_QUEUE: catalog_queue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skillhub_network

  booking-service:
    build:
      context: .
      dockerfile: apps/booking-service/Dockerfile
    restart: unless-stopped
    expose:
      - "3003"
      - "50053"
    environment:
      NODE_ENV: production
      BOOKING_SERVICE_HTTP_PORT: 3003
      BOOKING_SERVICE_GRPC_PORT: 50053
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: skillhub_booking
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      RABBITMQ_BOOKING_QUEUE: booking_queue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skillhub_network

  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    restart: unless-stopped
    expose:
      - "3004"
      - "50054"
    environment:
      NODE_ENV: production
      PAYMENT_SERVICE_HTTP_PORT: 3004
      PAYMENT_SERVICE_GRPC_PORT: 50054
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: skillhub_payment
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      RABBITMQ_PAYMENT_QUEUE: payment_queue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skillhub_network

  notifications-service:
    build:
      context: .
      dockerfile: apps/notifications-service/Dockerfile
    restart: unless-stopped
    expose:
      - "3005"
      - "50055"
    environment:
      NODE_ENV: production
      NOTIFICATIONS_SERVICE_HTTP_PORT: 3005
      NOTIFICATIONS_SERVICE_GRPC_PORT: 50055
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      RABBITMQ_NOTIFICATIONS_QUEUE: notifications_queue
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-moaazsaadawy.dev@gmail.com}
      APP_PASSWORD: ${APP_PASSWORD}
      SMTP_PASS: ${APP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-"skillHUB" <moaazsaadawy.dev@gmail.com>}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - skillhub_network

  media-service:
    build:
      context: .
      dockerfile: apps/media-service/Dockerfile
    restart: unless-stopped
    expose:
      - "3006"
      - "50056"
    environment:
      NODE_ENV: production
      MEDIA_SERVICE_HTTP_PORT: 3006
      MEDIA_SERVICE_GRPC_PORT: 50056
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      RABBITMQ_MEDIA_QUEUE: media_queue
      MINIO_ENDPOINT: minio
      MINIO_HOST_ENDPOINT: ${MINIO_HOST_ENDPOINT:-localhost}
      MINIO_PORT: 9000
      MINIO_PUBLIC_PORT: ${NGINX_PORT:-80}
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKET: skillhub-media
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - skillhub_network

  # ==============================================================================
  # Edge Reverse Proxy / Ingress
  # ==============================================================================

  nginx:
    image: nginx:alpine
    container_name: skillhub_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - skillhub_network

# ==============================================================================
# Networks & Volumes
# ==============================================================================

networks:
  skillhub_network:
    name: skillhub_network
    driver: bridge

volumes:
  postgres_data:
    name: skillhub_postgres_data
    driver: local
  redis_data:
    name: skillhub_redis_data
    driver: local
  rabbitmq_data:
    name: skillhub_rabbitmq_data
    driver: local
  minio_data:
    name: skillhub_minio_data
    driver: local
